# .github/workflows/ai-code-review.yml

name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize] # PR이 열리거나 새로운 커밋이 푸시될 때 실행

# 워크플로우가 PR에 코멘트를 작성할 수 있도록 권한을 부여합니다.
permissions:
  pull-requests: write

jobs:
  code-review:
    runs-on: ubuntu-latest
    steps:
      # 1. 소스 코드를 체크아웃합니다. fetch-depth: 0으로 전체 히스토리를 가져와야 diff가 정확합니다.
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. PR의 코드 변경사항(diff)을 추출합니다.
      - name: Get PR Diff
        id: diff
        run: |
          # 베이스 브랜치와 현재 PR 브랜치 간의 변경사항을 가져옵니다.
          DIFF_CONTENT=$(git diff ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})
          
          # JSON 페이로드로 보내기 위해 내용을 안전하게 이스케이프 처리합니다.
          # jq를 사용하여 문자열을 JSON 형식으로 변환합니다.
          ESCAPED_DIFF=$(echo "$DIFF_CONTENT" | jq -s -R .)
          
          # 다음 스텝에서 사용할 수 있도록 결과를 GITHUB_OUTPUT에 저장합니다.
          echo "diff_content=${ESCAPED_DIFF}" >> "$GITHUB_OUTPUT"

      # 3. Gemini API를 호출하여 코드 리뷰를 요청합니다.
      - name: Call Gemini for Code Review
        id: review
        run: |
          API_URL="https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${{ secrets.GEMINI_API_KEY }}"
          
          # Gemini에게 보낼 프롬프트를 구성합니다.
          PROMPT="당신은 시니어 소프트웨어 엔지니어입니다. 아래 git diff 형식의 코드 변경사항을 리뷰해주세요. 개선점, 잠재적인 버그, 코드 스타일, 베스트 프랙티스 준수 여부를 분석하고 리뷰 결과를 마크다운 형식으로 작성해주세요. 중요한 순서대로 핵심만 요약해서 알려주세요. 

코드 변경사항:
${{ steps.diff.outputs.diff_content }}"

          # API 요청 페이로드를 생성합니다.
          REQUEST_BODY=$(cat <<EOF
          {
            "contents": [{
              "parts": [{"text": ${PROMPT}}]
            }]
          }
          EOF
          )

          # curl을 사용하여 Gemini API에 POST 요청을 보냅니다.
          API_RESPONSE=$(curl -s -H "Content-Type: application/json" -X POST -d "$REQUEST_BODY" "$API_URL")
          
          # API 응답에서 리뷰 텍스트만 추출하고, 다음 스텝을 위해 이스케이프 처리합니다.
          REVIEW_COMMENT=$(echo "$API_RESPONSE" | jq -r '.candidates[0].content.parts[0].text')
          ESCAPED_COMMENT=$(echo "$REVIEW_COMMENT" | jq -s -R .)
          echo "comment=${ESCAPED_COMMENT}" >> "$GITHUB_OUTPUT"

      # 4. GitHub API를 사용하여 PR에 리뷰 코멘트를 등록합니다.
      - name: Post Review Comment to PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_ISSUE_URL: ${{ github.event.pull_request.issue_url }}
        run: |
          curl -s -X POST \
          -H "Authorization: token $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          "$PR_ISSUE_URL/comments" \
          -d "{\"body\": \"### 🤖 AI 코드 리뷰 요약\n\n${{ steps.review.outputs.comment }}\"}"
