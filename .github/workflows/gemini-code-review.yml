# .github/workflows/ai-code-review.yml

name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read           # 코드 체크아웃 및 diff에 필요
  pull-requests: write     # PR에 댓글을 달기 위해 필요

jobs:
  code-review:
    runs-on: ubuntu-latest
    steps:
      # 1. 소스 코드 체크아웃 (PR Fetch 오류 방지 설정)
      - name: Checkout Head Branch
        uses: actions/checkout@v4
        with:
          # 👇 GITHUB_TOKEN 사용
          token: ${{ secrets.GITHUB_TOKEN }}
          # 👇 오류 유발 참조 페치를 막기 위해 Head 브랜치만 명시적으로 체크아웃
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 10 # 전체 히스토리 대신 필요한 최소 깊이만 가져옴
          
      # 1.5. PR diff를 위해 Base 브랜치 내용을 수동으로 가져옴
      - name: Fetch Base Branch for Diff
        run: |
          # Base SHA가 로컬에 있어야 git diff가 정상 작동합니다.
          git fetch origin ${{ github.event.pull_request.base.ref }}

      # 2. PR의 코드 변경사항(diff) 추출 (JSON 이스케이프 추가)
      - name: Get PR Diff
        id: diff
        run: |
          # git diff 수행
          DIFF_CONTENT=$(git diff ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})
          
          # 👇 셸 특수문자를 안전하게 처리하기 위해 jq를 사용해 JSON 문자열로 이스케이프
          ESCAPED_DIFF=$(echo "$DIFF_CONTENT" | jq -s -R .)
          
          # 👇 JSON 이스케이프된 내용을 GITHUB_OUTPUT에 전달 (한 줄 문자열)
          echo "diff_content=$ESCAPED_DIFF" >> "$GITHUB_OUTPUT"

      # 3. Gemini API 호출 (JSON 포맷팅 및 입력 오류 해결)
      - name: Call Gemini for Code Review
        id: review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 👇 1. JSON 이스케이프된 output을 다시 일반 텍스트로 역변환하여 DIFF_CONTENT에 저장
          DIFF_CONTENT=$(echo "${{ steps.diff.outputs.diff_content }}" | jq -r .)
          
          API_URL="https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=$GEMINI_API_KEY"
          
          PROMPT_TEMPLATE="당신은 시니어 소프트웨어 엔지니어입니다. 아래 git diff 형식의 코드 변경사항을 리뷰해주세요. 개선점, 잠재적인 버그, 코드 스타일, 베스트 프랙티스 준수 여부를 분석하고 리뷰 결과를 마크다운 형식으로 작성해주세요. 중요한 순서대로 핵심만 요약해서 알려주세요. 코드 변경사항:"

          # 2. jq로 JSON 요청 본문 안전하게 생성
          REQUEST_BODY=$(jq -n \
            --arg prompt "$PROMPT_TEMPLATE" \
            --arg diff "$DIFF_CONTENT" \
            '{contents:[{parts:[{text: ($prompt + "\n\n```diff\n" + $diff + "\n```")}]}]}')

          API_RESPONSE=$(curl -s -H "Content-Type: application/json" -X POST -d "$REQUEST_BODY" "$API_URL")
          REVIEW_COMMENT=$(echo "$API_RESPONSE" | jq -r '.candidates[0].content.parts[0].text')
          
          # 👇 리뷰 결과를 다시 JSON 이스케이프하여 출력
          ESCAPED_COMMENT=$(echo "$REVIEW_COMMENT" | jq -s -R .)
          echo "comment=$ESCAPED_COMMENT" >> "$GITHUB_OUTPUT"

      # 4. PR에 리뷰 코멘트 등록 (JSON 역변환을 통한 출력 오류 해결)
      - name: Post Review Comment to PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_ISSUE_URL: ${{ github.event.pull_request.issue_url }}
        run: |
          # 👇 JSON 이스케이프된 output을 다시 일반 텍스트로 역변환하여 사용
          COMMENT_BODY=$(echo "${{ steps.review.outputs.comment }}" | jq -r .)
          
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "$PR_ISSUE_URL/comments" \
            -d "$(jq -n --arg body_text "### 🤖 AI 코드 리뷰 요약\n\n$COMMENT_BODY" '{body: $body_text}')"
