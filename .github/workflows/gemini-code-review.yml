name: Gemini AI Code Reviewer

on:
  issue_comment:
    types: [created]

permissions: write-all

jobs:
  gemini-code-review:
    runs-on: ubuntu-latest
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/review')
    steps:
      - name: PR Info
        run: |
          echo "Comment: ${{ github.event.comment.body }}"
          echo "Issue Number: ${{ github.event.issue.number }}"
          echo "Repository: ${{ github.repository }}"

      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          # 👇 GITHUB_TOKEN 사용
          token: ${{ secrets.GITHUB_TOKEN }}
          # 👇 오류 유발 참조 페치를 막기 위해 Head 브랜치만 명시적으로 체크아웃
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 10 # 전체 히스토리 대신 필요한 최소 깊이만 가져옴
          
      # 1.5. PR diff를 위해 Base 브랜치 내용을 수동으로 가져옴
      - name: Fetch Base Branch for Diff
        run: |
          # Base SHA가 로컬에 있어야 git diff가 정상 작동합니다.
          git fetch origin ${{ github.event.pull_request.base.ref }}

      - name: Get PR Details
        id: pr
        run: |
          PR_JSON=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number }})
          echo "head_sha=$(echo $PR_JSON | jq -r .head.sha)" >> $GITHUB_OUTPUT
          echo "base_sha=$(echo $PR_JSON | jq -r .base.sha)" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swisyn/gemini-ai-code-reviewer@v1.0.0
        with:
          GITHUB_API_URL: "https://github.mycompany.com/api/v3"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash # Optional, default is `gemini-2.0-flash-001`
          EXCLUDE: "*.md,*.txt,package-lock.json,*.yml,*.yaml"
